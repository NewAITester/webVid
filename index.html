<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لیریک استودیو</title>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>

<!--
  فیلترهای گرید نهایی.
  color-interpolation-filters="sRGB" حیاتی است: پیش‌فرض SVG فضای
  linearRGB است، ولی پایتون روی بایت‌های خام کار می‌کرد. بدون این
  خط، منحنی تُن نتیجهٔ کاملاً متفاوتی می‌دهد.
-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- منحنی تُن: y = (x^1.05)²(3-2x^1.05)·0.92 + x^1.05·0.08 -->
    <filter id="tone" x="0" y="0" width="100%" height="100%"
            color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0 0.00397 0.01223 0.02474 0.04141 0.06205 0.08644 0.11433 0.14548 0.17959 0.21636 0.2555 0.29667 0.33956 0.38384 0.42915 0.47514 0.52147 0.56778 0.61368 0.65882 0.70282 0.7453 0.78587 0.82415 0.85974 0.89225 0.92128 0.94642 0.96727 0.98343 0.99448 1"/>
        <feFuncG type="table" tableValues="0 0.00397 0.01223 0.02474 0.04141 0.06205 0.08644 0.11433 0.14548 0.17959 0.21636 0.2555 0.29667 0.33956 0.38384 0.42915 0.47514 0.52147 0.56778 0.61368 0.65882 0.70282 0.7453 0.78587 0.82415 0.85974 0.89225 0.92128 0.94642 0.96727 0.98343 0.99448 1"/>
        <feFuncB type="table" tableValues="0 0.00397 0.01223 0.02474 0.04141 0.06205 0.08644 0.11433 0.14548 0.17959 0.21636 0.2555 0.29667 0.33956 0.38384 0.42915 0.47514 0.52147 0.56778 0.61368 0.65882 0.70282 0.7453 0.78587 0.82415 0.85974 0.89225 0.92128 0.94642 0.96727 0.98343 0.99448 1"/>
      </feComponentTransfer>
    </filter>

    <!-- آستانهٔ بلوم: (x - 0.60) / 0.40 ، یعنی فقط روشنایی‌های بالای ۶۰٪ -->
    <filter id="bloomThresh" x="0" y="0" width="100%" height="100%"
            color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncR type="linear" slope="2.5" intercept="-1.5"/>
        <feFuncG type="linear" slope="2.5" intercept="-1.5"/>
        <feFuncB type="linear" slope="2.5" intercept="-1.5"/>
      </feComponentTransfer>
    </filter>
  </defs>
</svg>

<div id="app">
  <header class="bar">
    <div class="brand">لیریک<span>استودیو</span></div>
    <div class="spacer"></div>
    <div id="fps" class="pill">—</div>
    <button id="exportBtn" class="btn sm">خروجی</button>
  </header>

  <div id="exPanel" class="panel hidden">
    <div class="prow">
      <label>از</label><input id="exFrom" type="number" value="0" min="0" step="1">
      <label>تا</label><input id="exTo" type="number" value="10" min="1" step="1">
      <span class="dim">ثانیه</span>
      <div class="spacer"></div>
      <button class="btn sm ghost" data-range="0,10">۱۰ ثانیه</button>
      <button class="btn sm ghost" data-range="66,78">کرس</button>
      <button class="btn sm ghost" data-range="0,228.6">کل آهنگ</button>
    </div>
    <div class="prow">
      <label>کیفیت</label>
      <select id="exQ">
        <option value="6000000">سبک — ۶ مگابیت</option>
        <option value="12000000" selected>خوب — ۱۲ مگابیت</option>
        <option value="24000000">بالا — ۲۴ مگابیت</option>
      </select>
      <label><input id="exGrain" type="checkbox" checked> دانهٔ فیلم</label>
      <div class="spacer"></div>
      <button id="exGo" class="btn primary sm">شروع</button>
      <button id="exCancel" class="btn sm hidden">لغو</button>
    </div>
    <div id="exBar" class="bar2 hidden"><i></i></div>
    <div id="exMsg" class="msg"></div>
  </div>

  <main class="stagewrap">
    <canvas id="stage"></canvas>
    <div id="loading" class="loading">در حال آماده‌سازی…</div>
  </main>

  <section class="transport">
    <button id="play" class="btn primary" title="پخش / توقف">▶</button>
    <div class="time" id="tc">۰۰:۰۰٫۰۰</div>
    <input id="scrub" class="scrub" type="range" min="0" max="228.6" step="0.01" value="0">
    <div class="time dim" id="tdur">—</div>
  </section>

  <section class="strip" id="strip"></section>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
