[package]
name = "lyricstudio-core"
version = "0.1.0"
edition = "2021"
description = "Rust/WASM compute core for LyricStudio: per-pixel effects, color adjust, deterministic noise"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
