[package]
name = "lyricstudio-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "LyricStudio Rust engine: project model, keyframe evaluation, pixel effects (full-Rust Alight clone)"

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust font rasterizer for the software renderer (text layers).
fontdue = "0.9"
# Image decoding (JPEG/PNG/WebP, pure Rust) for image layers.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
