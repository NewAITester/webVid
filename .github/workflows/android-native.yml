name: LyricStudio Native (Android)

# برنامهٔ نیتیو Kotlin + Compose — کپی Alight Motion.
# بیلد لوکال در VM ممکن نیست (شبکهٔ جاوا/گردل در VM مسدود است)، پس APK اینجا ساخته می‌شود.
on:
  push:
    branches: [feature/android-native]
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'
  pull_request:
    branches: [feature/android-native]
    paths:
      - 'android-native/**'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: جاوا ۱۷
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # بدون setup-android: رانر اوبونتو SDK اندروید را از پیش نصب دارد و
      # اکشن setup-android در ران ۱ پس از ۱۶ ثانیه مرد (خطا در لاگ است، ولی
      # SDK پیش‌نصب‌شده همان چیزی است که لازم داریم).
      - name: کش Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-native-${{ runner.os }}-${{ hashFiles('android-native/**/*.gradle*', 'android-native/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-native-${{ runner.os }}-

      - name: آماده‌سازی Gradle (دانلود با تلاش دوباره + کش)
        # دانلود مستقیم توزیع Gradle گاهی از گیت‌هاب ۵۰۴ می‌گیرد؛ این اکشن
        # رسمی تلاش دوباره و کش دارد و نسخه را از wrapper می‌خواند.
        uses: gradle/actions/setup-gradle@v3

      - name: نصب Rust + هدف aarch64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: ساخت کتابخانهٔ Rust (JNI) برای arm64
        working-directory: android-native/rust/lyricstudio-jni
        run: |
          # لینکر NDK (پیش‌نصب‌شده روی رانر)؛ سطح API برابر minSdk (۲۴)
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ -z "$NDK" ]; then NDK=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1); fi
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          echo "NDK: $NDK"
          echo "Linker: $CLANG"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CLANG"
          cargo build --release --target aarch64-linux-android
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/liblyricstudio-jni.so ../app/src/main/jniLibs/arm64-v8a/
          ls -la ../app/src/main/jniLibs/arm64-v8a/

      - name: ساخت APK دیباگ
        working-directory: android-native
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: گزارش APK
        run: |
          APK=$(find android-native/app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "### APK نیتیو ساخته شد" >> $GITHUB_STEP_SUMMARY
          echo "فایل: \`$APK\` — حجم: **$(du -h "$APK" | cut -f1)**" >> $GITHUB_STEP_SUMMARY

      - name: آپلود APK
        uses: actions/upload-artifact@v4
        with:
          name: lyricstudio-native-apk
          path: android-native/app/build/outputs/apk/debug/*.apk
          retention-days: 7
