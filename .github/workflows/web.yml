name: ساخت و انتشار وب

on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── بیلد: همیشه اجرا می‌شود و خروجی قابل دانلود می‌سازد ──────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: نصب وابستگی‌ها
        # npm install (نه npm ci): وابستگی‌های FFmpeg تازه اضافه شده‌اند و
        # قفل‌فایل را خود npm به‌روز می‌کند
        run: npm install --no-audit --no-fund

      - name: تست موتور
        run: |
          node tests/engine.test.mjs
          node tests/song.test.mjs
          node tests/motion.test.mjs
          node tests/tools.test.mjs
          node tests/preview.test.mjs

      - name: بیلد
        run: npm run build

      - name: گزارش حجم خروجی
        run: |
          echo "### خروجی بیلد" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          du -sh dist >> $GITHUB_STEP_SUMMARY
          find dist -type f | sort >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # این همیشه کار می‌کند — چه ریپو خصوصی باشد چه عمومی
      - name: آپلود خروجی به‌عنوان artifact
        uses: actions/upload-artifact@v4
        with:
          name: lyricstudio-web
          path: dist
          retention-days: 30

      # این فقط وقتی ریپو عمومی باشد و Pages فعال باشد کار می‌کند
      - name: آماده‌سازی Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: آپلود برای Pages
        if: steps.pages.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

    outputs:
      pages_ready: ${{ steps.pages.outcome }}

  # ── انتشار روی Pages: اگر در دسترس نبود، کل بیلد را قرمز نمی‌کند ──
  deploy:
    needs: build
    if: needs.build.outputs.pages_ready == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

