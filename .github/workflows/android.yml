name: ساخت APK اندروید

on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:
    inputs:
      release:
        description: 'ساخت ریلیز با APK'
        type: boolean
        default: false
      test_webview:
        description: 'تست ثبت ابزارها در WebView واقعی شبیه‌ساز'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: جاوا ۱۷
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: کش Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: نصب وابستگی‌ها
        # npm install (نه npm ci): وابستگی‌های FFmpeg تازه اضافه شده‌اند و
        # قفل‌فایل را خود npm به‌روز می‌کند
        run: npm install --no-audit --no-fund

      - name: تست موتور
        run: |
          node tests/engine.test.mjs
          node tests/song.test.mjs
          node tests/motion.test.mjs
          node tests/tools.test.mjs
          node tests/preview.test.mjs
          node tests/export-modes.test.mjs
          node tests/emulator-host.test.mjs

      - name: نصب مرورگر آزمون خروجی
        run: |
          npx playwright install --with-deps chromium
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi

      - name: تست ویدیوی واقعی در هر دو روش
        run: node tests/export-modes.browser.mjs

      - name: ذخیرهٔ لاگ‌ها و ویدیوهای آزمون خروجی
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-mode-tests-android
          path: artifacts/export-tests/
          if-no-files-found: warn
          retention-days: 14

      - name: بیلد وب
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: همگام‌سازی با پروژهٔ اندروید
        run: npx cap sync android

      - name: بررسی اینکه دارایی‌ها واقعاً داخل اپ هستند
        run: |
          echo "### دارایی‌های بسته‌بندی‌شده" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find android/app/src/main/assets/public -type f | sort >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          test -f android/app/src/main/assets/public/data/Neghab.mp3
          test -f android/app/src/main/assets/public/fonts/IRANSansX-Black.ttf
          test -f android/app/src/main/assets/public/data/lyrics.lrc
          # Only small manifests, never Python/FFmpeg binaries in app updates.
          test -f android/app/src/main/assets/public/tools-manifest.json
          test -f android/app/src/main/assets/public/tools-sw.js
          test -f android/app/src/main/assets/public/pyodide/bundled.json
          test ! -f android/app/src/main/assets/public/pyodide/pyodide.asm.wasm
          test ! -d android/app/src/main/assets/public/ffmpeg
          ! find android/app/src/main/assets/public -name '*.whl' | grep -q .
          # فونت‌های همراه برنامه
          test -f android/app/src/main/assets/public/webfonts/fonts.json
          ls android/app/src/main/assets/public/webfonts/*.ttf | wc -l

      - name: ساخت APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: آماده‌سازی فضای runner و نصب ایمیج شبیه‌ساز
        if: github.ref == 'refs/heads/feature/optional-runtime-downloads' || (github.event_name == 'workflow_dispatch' && inputs.test_webview)
        run: bash scripts/prepare-emulator-host.sh prepare

      - name: دسترسی به شتاب‌دهی شبیه‌ساز
        if: github.ref == 'refs/heads/feature/optional-runtime-downloads' || (github.event_name == 'workflow_dispatch' && inputs.test_webview)
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: تست ابزارها در WebView واقعی APK
        if: github.ref == 'refs/heads/feature/optional-runtime-downloads' || (github.event_name == 'workflow_dispatch' && inputs.test_webview)
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 20
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          # Reserve actual disk space; this system image can exceed a requested partition size.
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

      - name: گزارش تست Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tool-tests
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/androidTests/
          if-no-files-found: ignore

      - name: نام‌گذاری و گزارش
        id: apk
        run: |
          SRC=android/app/build/outputs/apk/debug/app-debug.apk
          OUT=lyricstudio-${{ github.run_number }}.apk
          cp "$SRC" "$OUT"
          SIZE=$(du -h "$OUT" | cut -f1)
          echo "path=$OUT" >> $GITHUB_OUTPUT
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "### APK ساخته شد" >> $GITHUB_STEP_SUMMARY
          echo "فایل: \`$OUT\` — حجم: **$SIZE**" >> $GITHUB_STEP_SUMMARY

      - name: آپلود APK
        uses: actions/upload-artifact@v4
        with:
          name: lyricstudio-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: انتشار در ریلیز
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: لیریک استودیو — بیلد ${{ github.run_number }}
          body: |
            نسخهٔ آزمایشی اپ اندروید.

            - حجم: ${{ steps.apk.outputs.size }}
            - کاملاً آفلاین (آهنگ، فونت‌ها و شعر داخل اپ)
            - امضای debug — هنگام نصب باید «نصب از منابع ناشناس» را اجازه بدهید
          files: ${{ steps.apk.outputs.path }}

