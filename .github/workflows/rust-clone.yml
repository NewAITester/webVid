name: rust-clone (LyricStudio Rust APK)

on:
  push:
    branches: [feature/android-native]
    paths:
      - 'rust-clone/**'
      - '.github/workflows/rust-clone.yml'
  workflow_dispatch:

jobs:
  build-rust-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-clone

      # بدون setup-android: رانر اوبونتو SDK اندروید را از پیش نصب دارد و
      # اکشن setup-android در ران ۱ پس از ۱۷ ثانیه مرد (sdkmanager tools
      # دیگر وجود ندارد) — همان شکستی که ران ۱ ورک‌فلوی کوت‌لین هم داشت.
      - name: Install NDK + platform (preinstalled SDK)
        run: |
          CMDLINE="$(ls -d "$ANDROID_HOME"/cmdline-tools/* 2>/dev/null | sort -V | tail -1)"
          yes | "$CMDLINE/bin/sdkmanager" --licenses >/dev/null
          "$CMDLINE/bin/sdkmanager" "ndk;28.1.13356709" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.1.13356709" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.1.13356709" >> $GITHUB_ENV

      - name: Engine tests
        working-directory: rust-clone
        run: cargo test -p lyricstudio-engine

      - name: App check (Android target)
        working-directory: rust-clone
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CARGO_TARGET_AARCH64_LINUX_ANDROID_AR: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
        run: cargo check -p lyricstudio-app --target aarch64-linux-android

      - name: Install cargo-apk
        run: cargo install cargo-apk --version 0.10.0

      # cargo-apk must run from the app crate's directory: from the
      # workspace root it is handed the virtual manifest and fails with
      # "virtual manifests must be configured with '[workspace]'"
      # (run #2). The APK still lands in rust-clone/target/android-artifacts.
      - name: Build APK
        working-directory: rust-clone/crates/app
        run: cargo apk build --release

      - name: Collect APK
        working-directory: rust-clone
        run: |
          find target/android-artifacts -name '*.apk' -print
          cp "$(find target/android-artifacts -name '*.apk' | head -n 1)" lyricstudio-rust.apk
          ls -la lyricstudio-rust.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lyricstudio-rust-apk
          path: rust-clone/lyricstudio-rust.apk
          retention-days: 7
